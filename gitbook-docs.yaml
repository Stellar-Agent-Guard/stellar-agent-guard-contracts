# Repository-side authority for which directory feeds which GitBook space.
# The connected branch, sync direction, and fork previews are configured in the
# GitBook app, not here; a change to a `key`, `path`, or `directory` alters
# published URLs and needs maintainer sign-off. Process, ownership, and the
# post-merge handoff: docs/README.md and docs/contributing.md.
site:
  title: Stellar Agent Guard — Contracts
  structure:
    - type: section
      key: section-learn
      title: Learn
      default: true
      path: learn
      children:
        - type: space
          key: space-getting-started
          title: Getting Started
          path: getting-started
          default: true
          content:
            directory: ./
        - type: space
          key: space-concepts
          title: Concepts
          path: concepts
          content:
            directory: ./concepts
        - type: space
          key: space-functions
          title: Functions
          path: functions
          content:
            directory: ./functions
