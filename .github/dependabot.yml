# Dependabot version updates (issue #72).
#
# Two ecosystems, two independent PR streams, so crate bumps and workflow pin
# bumps never land in the same pull request:
#
#   * `cargo`          - the contract crate (root manifest) and the
#                        tools/agent-tx helper (its own Cargo.toml + lockfile).
#   * `github-actions` - the SHA-pinned workflow actions. See CONTRIBUTING.md
#                        "GitHub Actions pinning": every `uses:` keeps a full
#                        commit SHA plus a version comment, and Dependabot is
#                        the only sanctioned way to move a SHA (it updates the
#                        pin and the comment together).
#
# Cargo groups are evaluated top-to-bottom and a dependency lands in the FIRST
# group it matches:
#
#   1. `soroban-sdk-majors` - soroban-sdk *major* bumps only. Major SDK bumps
#      can break the contract ABI / auth interface, so they are isolated in
#      their own PR and re-verified against SPEC §1.1 and
#      tests/fixtures/index.json before merge (never batched with anything).
#   2. `soroban-sdk`        - soroban-sdk minor/patch bumps, kept apart from
#      the rest of the crate graph for the same review reason.
#   3. `cargo-minor-patch`  - everything else, minor and patch only. Major
#      bumps of any other crate stay ungrouped (one PR per crate) for the same
#      reason.
#
# Every dependabot PR must pass the full `ci` job before merge - branch
# protection already enforces this; see CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/tools/agent-tx"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      soroban-sdk-majors:
        patterns:
          - "soroban-sdk"
        update-types:
          - "major"
      soroban-sdk:
        patterns:
          - "soroban-sdk"
        update-types:
          - "minor"
          - "patch"
      cargo-minor-patch:
        patterns:
          - "*"
# Dependabot keeps the RUSTSEC surface fresh and Actions pins current.
# Weekly cadence; PRs are capped so the security-sensitive review queue
# stays triageable. Every PR must still pass the full `ci` gate
# (branch protection on `main` enforces this) — see CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "cargo"
    # Root manifest plus the tool/bench members (tools/agent-tx, benches)
    # are picked up via the workspace lockfile from "/".
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # soroban-sdk majors are isolated on purpose: a major bump can break
      # the CustomAccountInterface ABI and the auth-context semantics quoted
      # in SPEC §1.1, so it must land alone for a focused review + the
      # SPEC §1.1 re-verification ratchet (CONTRIBUTING.md). Do NOT fold it
      # into the grouped minor/patch set below.
      soroban-sdk:
        patterns:
          - "soroban-sdk"
      # Everything else (minor + patch only) is grouped to keep PR noise low.
      cargo-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-sdk"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
      time: "06:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
