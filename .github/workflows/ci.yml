name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job name must stay exactly `ci`: the repo's `main-protection` ruleset
  # (phase 0) requires the `ci` status check on `main`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all + pedantic deny, all targets/features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo test

      # Reason-symbol parity gate (issue #41): the contract's auth_checked
      # reason vocabulary must match the committed SDK vocabulary copy and the
      # fixture evidence. `cargo test` already enforces the contract↔vocabulary
      # half (tests/reason_parity.rs); this standalone run adds the fixture-
      # evidence check and a human-readable diff without needing a Rust build
      # (e.g. for reason-only PRs in the SDK repo's CI).
      - name: Reason parity check (contract ↔ SDK vocabulary ↔ fixtures)
        run: ./scripts/check-reason-parity.sh

      - name: Contract build (wasm32v1-none)
        run: cargo build --release --target wasm32v1-none

      - name: Agent submission tool build (tools/agent-tx)
        run: cargo build --release --manifest-path tools/agent-tx/Cargo.toml