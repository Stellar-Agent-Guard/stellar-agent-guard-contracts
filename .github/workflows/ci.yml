name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job name must stay exactly `ci`: the repo's `main-protection` ruleset
  # (phase 0) requires the `ci` status check on `main`.
  ci:
    runs-on: ubuntu-latest
    steps:
      # Every action below is pinned to a full 40-char commit SHA so a
      # rewritten tag cannot swap the code CI runs. Bump SHAs only through
      # Dependabot `github-actions` PRs — never by hand (see CONTRIBUTING.md).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (all + pedantic deny, all targets/features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo test

      - name: Contract build (wasm32v1-none)
        run: cargo build --release --target wasm32v1-none

      - name: Agent submission tool build (tools/agent-tx)
        run: cargo build --release --manifest-path tools/agent-tx/Cargo.toml