name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job name must stay exactly `ci`: the repo's `main-protection` ruleset
  # (phase 0) requires the `ci` status check on `main`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      # Enforces the CONTRIBUTING rule-1 deny-list (issue #66): the clippy
      # `unwrap_used`/`expect_used`/`panic` lints are set to `deny` in
      # Cargo.toml `[lints.clippy]`, so a new unguarded unwrap/expect/bare
      # panic in `src/` fails this step. Test/example targets are exempted
      # in-tree with `#[allow]`s.
      - name: Clippy (all + pedantic deny, all targets/features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo test

      - name: Contract build (wasm32v1-none)
        run: cargo build --release --target wasm32v1-none

      - name: Agent submission tool build (tools/agent-tx)
        run: cargo build --release --manifest-path tools/agent-tx/Cargo.toml