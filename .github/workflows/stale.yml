name: stale

# Draft PRs only. Ready-for-review PRs and issues are never auto-closed:
# the backlog is curated by maintainers, not by inactivity timers.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 14
          days-before-close: 7
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-message: 'This draft PR has been idle for 14 days. If you are still working on it, please rebase onto main and push to reset the timer. Otherwise it will be closed in 7 days.'
          close-pr-message: 'Closing this draft after 21 days of inactivity. Reopen or re-push a rebased branch whenever you are ready.'
          remove-stale-when-updated: true
          exempt-pr-labels: 'complexity: large'
          operations-per-run: 30

