name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The job builds the deployable WASM and attaches it to a GitHub Release
# together with a CycloneDX SBOM (sbom.cdx.json) that inventories every crate
# and version compiled into that WASM build — the artifact an auditor or bug
# bounty reviewer needs to know exactly what shipped. See SECURITY.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Required to create/update the Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full 40-char commit SHAs (tag rewriting cannot
      # swap the code this release build runs). Bump SHAs only via Dependabot
      # `github-actions` PRs — never by hand (see CONTRIBUTING.md).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contract (wasm32v1-none)
        run: cargo build --release --target wasm32v1-none

      # Tool choice: cargo-cyclonedx (cyclonedx-rust-cargo). Unlike lockfile-only
      # scanners it sources Cargo metadata + Cargo.lock and honours --target, so
      # the component list describes the WASM build's dependency graph rather
      # than the host build's.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM (WASM target)
        run: cargo cyclonedx --format json --describe binaries --target wasm32v1-none

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp target/wasm32v1-none/release/*.wasm dist/
          # `--describe binaries` emits one SBOM per binary target; this crate
          # has exactly one (the shipped cdylib), renamed to a stable asset name.
          cp ./*-cdylib.cdx.json dist/sbom.cdx.json
          # Downstream repos (dashboard / SDK / deploy automation) must consume
          # the release's artifact provenance rather than one hardcoded hash.
          sha256sum dist/*.wasm dist/sbom.cdx.json > dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.wasm
            dist/sbom.cdx.json
            dist/checksums.txt
          generate_release_notes: true
