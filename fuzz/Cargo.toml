[package]
name = "stellar-agent-guard-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
ed25519-dalek = "2"
libfuzzer-sys = "0.4"
soroban-sdk = { version = "=27.0.6", features = ["alloc", "testutils"] }
stellar-xdr = "=27.0.0"
stellar-agent-guard-contracts = { path = "..", features = ["testutils"] }

[[bin]]
name = "check_auth_full_path"
path = "fuzz_targets/check_auth_full_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_config_deserialization"
path = "fuzz_targets/policy_config_deserialization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seed-policy-config"
path = "src/bin/seed_policy_config.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]